<!-- @dsCard group="Motion" height=330 subtitle="Cart items drop into the box; flaps close; tape seals" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Checkout</title></head>
<body style="margin:0;background:var(--ground)">
<div class="ic-root" style="padding:16px;max-width:360px">
  <section class="ic-stack" style="background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px">
    <h3 class="subheading" style="margin:0">Your cart · 3 items</h3>
    <div class="ic-row" style="gap:8px">
      <img class="thumb" src="/_blob/b1d5730fe9212d537b6466b7ecb1c018" alt="Kilim rug" style="width:56px;height:56px;object-fit:cover;border-radius:var(--radius-md)">
      <img class="thumb" src="/_blob/c3becedf77a042d8cfa4ce581240ac56" alt="Aluminum pots" style="width:56px;height:56px;object-fit:cover;border-radius:var(--radius-md)">
      <img class="thumb" src="/_blob/b1d5730fe9212d537b6466b7ecb1c018" alt="Kilim rug, second size" style="width:56px;height:56px;object-fit:cover;border-radius:var(--radius-md)">
    </div>
    <div style="display:flex;justify-content:space-between" class="ic-num"><span style="color:var(--ink-muted)">Subtotal</span><b>USD 512.00</b></div>
    <button class="ic-btn ic-btn--primary ic-btn--lg ic-btn--block ic-mbtn" id="co" data-state="idle"><svg class="ic-box" viewBox="0 0 24 24" aria-hidden="true"><path class="body" d="M4 9h16v11H4z"/><path class="flap flap-l" d="M4 9 1 5"/><path class="flap flap-r" d="M20 9l3-4"/><path class="tape" d="M7 9h10"/></svg><span class="ic-mbtn__label">Checkout · USD 512.00</span></button>
    <button class="ic-btn ic-btn--ghost ic-btn--sm" id="reset" style="align-self:center">Replay</button>
  </section>
</div>
<script>
  var co = document.getElementById('co');
  co.addEventListener('click', function () { iCommerce.checkout(co, { items: [].slice.call(document.querySelectorAll('.thumb')) }); });
  document.getElementById('reset').addEventListener('click', function () {
    co.setAttribute('data-state', 'idle'); co.querySelector('.ic-box').classList.remove('is-closed');
    co.querySelector('.ic-mbtn__label').textContent = 'Checkout · USD 512.00';
  });
</script>
</body></html>
