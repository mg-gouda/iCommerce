<!-- @dsCard group="Status" height=110 subtitle="Trust · channel · promo · state" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Badge</title></head>
<body style="margin:0;background:var(--surface)">
<div class="ic-root ic-stack" style="padding:16px">
  <div class="ic-row">
    <span class="ic-badge ic-badge--verified"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg> Verified supplier</span>
    <span class="ic-badge ic-badge--b2b">B2B</span>
    <span class="ic-badge ic-badge--sale">−15%</span>
    <span class="ic-badge">MOQ 50</span>
    <span class="ic-badge">Made in Egypt</span>
  </div>
  <div class="ic-row">
    <span class="ic-badge ic-badge--success"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg> Quote accepted</span>
    <span class="ic-badge ic-badge--warning"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Expires in 2 days</span>
    <span class="ic-badge ic-badge--danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg> Invoice overdue</span>
  </div>
</div>
</body></html>
