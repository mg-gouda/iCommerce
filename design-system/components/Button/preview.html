<!-- @dsCard group="Actions" height=150 subtitle="Primary / secondary / ghost / danger · 3 sizes · disabled · busy" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Button</title></head>
<body style="margin:0;background:var(--ground)">
<div class="ic-root ic-stack" style="padding:16px">
  <div class="ic-row">
    <button class="ic-btn ic-btn--primary">Add to cart</button>
    <button class="ic-btn">Request quote</button>
    <button class="ic-btn ic-btn--ghost">Contact supplier</button>
    <button class="ic-btn ic-btn--danger">Cancel order</button>
  </div>
  <div class="ic-row">
    <button class="ic-btn ic-btn--primary ic-btn--lg">Place order · USD 920.00</button>
    <button class="ic-btn ic-btn--sm">Export CSV</button>
    <button class="ic-btn ic-btn--primary" disabled>Below MOQ</button>
    <button class="ic-btn ic-btn--primary" aria-busy="true">Saving</button>
  </div>
</div>
</body></html>
